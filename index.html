<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18221d" />
  <meta name="description" content="Golden fish circle beneath weathered docks in a quiet, living salmon farm." />
  <link rel="icon" href="data:," />
  <link rel="preload" as="image" href="/tanks/opening.webp" fetchpriority="high" />
  <title>salmon-farm</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #18221d; overflow: hidden; color-scheme: dark; }
    #opening { position: fixed; z-index: 2; inset: 0; pointer-events: none; background: #18221d url('/tanks/opening.webp') center / cover no-repeat; opacity: 1; transition: opacity 250ms ease; }
    #opening.is-gone { opacity: 0; }
    #loading { position: fixed; z-index: 3; inset: auto 0 0; height: 2px; pointer-events: none; opacity: 1; transition: opacity 150ms ease; }
    #loading b { position: absolute; inset: 0; background: rgb(236 233 226 / 70%); transform: scaleX(0.04); transform-origin: left; animation: loading-progress 7s cubic-bezier(0.1, 0.6, 0.2, 1) forwards; }
    #loading.is-done b { animation: none; transform: scaleX(1); transition: transform 100ms ease; }
    #loading.is-gone { opacity: 0; }
    @keyframes loading-progress { from { transform: scaleX(0.04); } to { transform: scaleX(0.88); } }
    @media (prefers-reduced-motion: reduce) { #opening, #loading, #loading b { transition: none; animation: none; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="opening" aria-hidden="true"></div>
  <div id="loading" role="progressbar" aria-label="Loading salmon farm"><b></b></div>
  <noscript>This scene needs JavaScript.</noscript>
  <script type="module" src="./src/main.tsx"></script>
</body>
</html>
